# slam_toolbox (online async) config for the moto_sim city sensor-world.
#
# Consumes /moto/scan + TF (map→odom from slam, odom→base_link from the bridge,
# base_link→lidar_link static) and builds a live 2D occupancy map of the city.
#
# Frame chain MUST be: map → odom → base_link → lidar_link
slam_toolbox:
  ros__parameters:
    # Use Gazebo sim time so scan + TF stamps align (lidar publishes sim time).
    use_sim_time: true
    # ── Frames / topics ──────────────────────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /moto/scan
    mode: mapping

    # ── Solver ───────────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── Rates / map ──────────────────────────────────────────────────────────
    map_update_interval: 1.0
    resolution: 0.10
    max_laser_range: 55.0           # < sensor max (60 m) to drop noisy far returns
    minimum_time_interval: 0.2
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # ── Scan matching ──────────────────────────────────────────────────────────
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.4    # add a node every 0.4 m / 0.4 rad
    minimum_travel_heading: 0.4
    scan_buffer_size: 12
    scan_buffer_maximum_scan_distance: 60.0
    link_match_minimum_response_fine: 0.12
    link_scan_maximum_distance: 12.0

    # ── Loop closure (corrects odometry drift) ─────────────────────────────────
    do_loop_closing: true
    loop_search_maximum_distance: 12.0
    loop_match_minimum_chain_size: 8
    loop_match_minimum_response_coarse: 0.30
    loop_match_minimum_response_fine: 0.40

    # ── Correlation grids ──────────────────────────────────────────────────────
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
