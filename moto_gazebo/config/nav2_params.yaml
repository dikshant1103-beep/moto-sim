# nav2 params — CAR-LIKE motorcycle in the endless city.
#
# Tuned for a non-holonomic motorcycle: forward-only Dubins planning with a minimum
# turning radius, Regulated Pure Pursuit (no in-place rotation, no reversing), and
# obstacle avoidance from /moto/scan. Map→odom comes from slam_toolbox; odom→base_link
# from the ws_bridge; base_link→lidar_link static. Output /cmd_vel → cmd_vel_to_moto
# adapter → PyChrono lean.
#
# EXPECT TO TUNE: turning radius, lookahead, inflation, speeds — on-machine.
# All nodes use_sim_time (Gazebo /clock).

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /moto/odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 3.0
      yaw_goal_tolerance: 3.15      # roaming: don't care about final heading
      stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 5.0
      lookahead_dist: 8.0
      min_lookahead_dist: 4.0
      max_lookahead_dist: 12.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 5.0
      regulated_linear_scaling_min_speed: 1.5
      allow_reversing: false
      use_rotate_to_heading: false   # CRITICAL: a motorcycle cannot rotate in place
      max_robot_pose_search_dist: 12.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.1
      footprint: "[[1.4,0.35],[1.4,-0.35],[-0.4,-0.35],[-0.4,0.35]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /moto/scan
          sensor_frame: lidar_link
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 4.0
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          obstacle_max_range: 45.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 2.5
        cost_scaling_factor: 2.5

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 160
      height: 160
      resolution: 0.15
      track_unknown_space: false
      footprint: "[[1.4,0.35],[1.4,-0.35],[-0.4,-0.35],[-0.4,0.35]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /moto/scan
          sensor_frame: lidar_link
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 4.0
          raytrace_max_range: 55.0
          obstacle_max_range: 50.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 2.5
        cost_scaling_factor: 2.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 3.0
      motion_model_for_search: "DUBIN"   # forward-only car-like (no reverse)
      minimum_turning_radius: 25.0       # MEASURED: bike does ~25-30 m at cruise via
                                         # steer_target (was 5.0 → nav2 planned turns the
                                         # bike couldn't follow). Re-measure & tune live.
      angle_quantization_bins: 72
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 5.0
      smooth_path: true
      analytic_expansion_ratio: 3.5
      reverse_penalty: 2.0
      change_penalty: 0.2
      non_straight_penalty: 1.2
      cost_penalty: 2.0

behavior_server:
  ros__parameters:
    use_sim_time: true
    behavior_plugins: ["wait"]          # no spin/backup — not motorcycle-feasible
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    max_velocity: [6.0, 0.0, 1.5]
    min_velocity: [0.0, 0.0, -1.5]
    max_accel: [2.0, 0.0, 1.5]
    max_decel: [-3.0, 0.0, -1.5]
    odom_topic: "/moto/odom"
